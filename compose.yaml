services:                                                                             
  web:
    build: .
    ports:
      - "8085:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

    restart: unless-stopped


  client:
  image: alpine
  command: sleep infinity

  env_file:
    - .env

  depends_on:
    web:
      condition: service_healthy

  volumes:
    - lab-data:/data

  restart: unless-stopped


volumes:
  lab-data:
